
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дёнермаркет</title>
</head>
<body>
<script>
  const ua = navigator.userAgent;

  if (/android/i.test(ua)) {
    location.replace(
      "https://play.google.com/store/apps/details?id=com.deliverest.denermarket"
    );
  } else if (/iPhone|iPad|iPod/i.test(ua) ||
             (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) {
    location.replace(
      "https://apps.apple.com/ru/app/id6744818721"
    );
  } else {
    document.body.innerHTML = `
      <h2>Скачайте приложение Дёнермаркет</h2>
      <p><a href="https://apps.apple.com/ru/app/id6744818721">
        Скачать для iPhone</a></p>
      <p><a href="https://play.google.com/store/apps/details?id=com.deliverest.denermarket">
        Скачать для Android</a></p>
    `;
  }
</script>
</body>
</html>
